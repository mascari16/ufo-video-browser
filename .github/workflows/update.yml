name: Check for new UFO videos

on:
  schedule:
    - cron: '17 13 * * *'   # daily, about 8:17 AM Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new videos
        run: node scripts/update.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add extra.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Add newly released videos" && git push; fi
