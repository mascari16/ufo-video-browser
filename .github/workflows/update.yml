name: Check for new UFO videos

on:
  schedule:
    - cron: '17 13 * * *'   # daily, about 8:17 AM Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: video-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new videos
        run: node scripts/update.mjs
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add extra.json last-check.json 2>/dev/null || git add extra.json
          if git diff --cached --quiet; then echo "No changes."; else if git diff --cached --quiet -- extra.json; then msg="Monthly keep-alive check"; else msg="Add newly released videos"; fi; git commit -m "$msg" && git push; fi
